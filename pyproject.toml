[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agh-stations"
version = "0.1.0"
description = "Discrete ABC for an OSM-based station location demonstrator at AGH"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
geo = ["osmnx>=2.1,<3"]
report = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
agh-stations = "agh_stations.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
